name: CI

on:
  push:
    branches: [v2]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sensitive-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-sensitive-checker/go.mod
          cache-dependency-path: go-sensitive-checker/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sensitive-checker-backend ./go-sensitive-checker
      - run: docker build -f Dockerfile.frontend -t sensitive-checker-frontend .
      - run: SENSITIVE_ADMIN_TOKEN=ci-test-token docker compose config --quiet
